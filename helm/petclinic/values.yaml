registry: 721449410291.dkr.ecr.ap-south-1.amazonaws.com
imageTag: latest

springProfiles: docker,mysql

eurekaUrl: http://discovery-server:8761/eureka

mysql:
  url: jdbc:mysql://mysql:3306/petclinic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  username: petclinic
  secretName: mysql-secret

services:
  config-server:
    port: 8888
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    initContainers: []

  discovery-server:
    port: 8761
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    initContainers:
      - name: wait-config
        url: tcp://config-server:8888

  customers-service:
    port: 8081
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 700m
        memory: 640Mi
    initContainers:
      - name: wait-config
        url: tcp://config-server:8888
      - name: wait-discovery
        url: tcp://discovery-server:8761
      - name: wait-mysql
        url: tcp://mysql:3306

  vets-service:
    port: 8083
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 700m
        memory: 640Mi
    initContainers:
      - name: wait-config
        url: tcp://config-server:8888
      - name: wait-discovery
        url: tcp://discovery-server:8761
      - name: wait-mysql
        url: tcp://mysql:3306

  visits-service:
    port: 8082
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 700m
        memory: 640Mi
    initContainers:
      - name: wait-config
        url: tcp://config-server:8888
      - name: wait-discovery
        url: tcp://discovery-server:8761
      - name: wait-mysql
        url: tcp://mysql:3306

  api-gateway:
    port: 8080
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 700m
        memory: 640Mi
    initContainers:
      - name: wait-config
        url: tcp://config-server:8888
      - name: wait-discovery
        url: tcp://discovery-server:8761

  genai-service:
    port: 8084
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 700m
        memory: 640Mi
    initContainers:
      - name: wait-config
        url: tcp://config-server:8888
      - name: wait-discovery
        url: tcp://discovery-server:8761
    extraEnv:
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: openai-secret
            key: OPENAI_API_KEY

ingress:
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  services:
    - api-gateway
    - customers-service
    - vets-service
    - visits-service
