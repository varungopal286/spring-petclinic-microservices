{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "petclinic.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- if $svc.initContainers }}
      initContainers:
        {{- range $svc.initContainers }}
        - name: {{ .name }}
          image: busybox:1.35
          command:
            - sh
            - -c
            {{- if hasPrefix "tcp://" .url }}
            - |
              HOST={{ trimPrefix "tcp://" .url | splitList ":" | first }}
              PORT={{ trimPrefix "tcp://" .url | splitList ":" | last }}
              until nc -z $HOST $PORT; do
                echo "Waiting for $HOST:$PORT..."
                sleep 5
              done
            {{- else }}
            - |
              until wget -qO- {{ .url }} | grep -q UP; do
                echo "Waiting for {{ .url }}..."
                sleep 5
              done
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $.Values.registry }}/petclinic/spring-petclinic-{{ $name }}:{{ $.Values.imageTag }}
          ports:
            - containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: petclinic-config
            - secretRef:
                name: {{ $.Values.mysql.secretName }}
          {{- if $svc.extraEnv }}
          env:
            {{- toYaml $svc.extraEnv | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
{{- end }}
