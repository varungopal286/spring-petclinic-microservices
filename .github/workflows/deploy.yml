name: Build and Deploy to EKS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 622215956811.dkr.ecr.ap-south-1.amazonaws.com
  CLUSTER_NAME: petclinic-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker images with Maven
        run: |
          cat > /tmp/docker-wrapper << 'EOF'
          #!/bin/bash
          if [ "$1" = "build" ]; then
            shift
            exec docker buildx build "$@"
          else
            exec docker "$@"
          fi
          EOF
          chmod +x /tmp/docker-wrapper
          ./mvnw clean install -P buildDocker -DskipTests \
            -Dcontainer.executable=/tmp/docker-wrapper

      - name: Tag and push images to ECR
        run: |
          IMAGE_TAG=${{ github.sha }}
          for svc in config-server discovery-server customers-service vets-service visits-service api-gateway; do
            docker tag springcommunity/spring-petclinic-${svc}:latest \
              ${{ env.ECR_REGISTRY }}/petclinic/spring-petclinic-${svc}:${IMAGE_TAG}
            docker push ${{ env.ECR_REGISTRY }}/petclinic/spring-petclinic-${svc}:${IMAGE_TAG}
            echo "Pushed ${svc}:${IMAGE_TAG}"
          done

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS with Helm
        run: |
          IMAGE_TAG=${{ github.sha }}
          helm upgrade petclinic ./helm/petclinic \
            --namespace petclinic \
            --set imageTag=${IMAGE_TAG} \
            --wait \
            --timeout 10m
